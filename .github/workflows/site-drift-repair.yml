name: Site drift repair

run-name: "Site drift repair after ${{ github.ref_name }}"

# The measurements, retractions and traps behind this file are in
# docs/ci/site-drift-repair.md. Only `# why:` lines live here, and
# docs/ci/README.md carries the rules every workflow has to obey.

on:
  push:
    # why: the MERGE is what makes the pre-merge tree wrong. sitemap <lastmod> is the
    # page's git date, so the correct value for a page a PR changes is the date that
    # PR merges -- a date that does not exist while the PR is open.
    branches: [main]

concurrency:
  group: site-drift-repair
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  repair:
    name: Regenerate the discovery surface and propose the repair
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Regenerate the discovery surface
        run: node tooling/sites/generate-discovery.mjs

      - name: Propose the repair (pull request)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # 🔴 WRITTEN ON BOTH PATHS, so `Preserve the computed repair` below can
          # keep `if-no-files-found: error`. An empty directory would otherwise
          # read the same as a directory this step never reached.
          OUT="${RUNNER_TEMP}/site-drift-repair"
          mkdir -p "$OUT"
          if [ -z "$(git status --porcelain -- sites/)" ]; then
            echo 'The regenerated discovery surface was byte-identical to main. Nothing was proposed.' > "$OUT/NO-DRIFT.txt"
            echo "::notice title=No site drift::The regenerated discovery surface is byte-identical to what main already carries. There is nothing to repair, which is the state this workflow exists to keep main in."
            exit 0
          fi

          echo "The regenerated surface differs from main:"
          git status --porcelain -- sites/

          BRANCH="chore/site-drift-${{ github.run_id }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -A so a file the generator ADDS (a brand-new landing joins the
          # sitemap in the run that creates it) is carried too, not only the
          # modifications. Scoped to sites/ so nothing else can ride along.
          git add -A -- sites/
          git checkout -b "$BRANCH"
          git commit -m "sites: regenerate the discovery surface after ${GITHUB_SHA}" -m "Written by .github/workflows/site-drift-repair.yml, which runs tooling/sites/generate-discovery.mjs on every push to main. The pull request body says what this closes and what it does not."

          {
            printf '%s\n\n' 'The generator `tooling/sites/generate-discovery.mjs` produced a discovery surface that differs from what `main` carries, so `tooling/ci/check-site-integrity.mjs` is failing (or is about to fail) on `main`. This branch is that regeneration, unedited.'
            printf '%s\n\n' '**Why no pre-merge lane could have caught it.** `<lastmod>` is derived from each page git date (`tooling/sites/lastmod.mjs`), so the correct value for a page a PR changes is the date that PR *merges* — a date that does not exist while the PR is open. The `sites` job in `ci.yml` is right about the pre-merge tree every time, and the merge is what makes it wrong. This was hand-repaired in `f67ee2b` (2026-08-25) and again 16 days earlier in `6ea109d`.'
            printf '%s\n\n' '**HONEST RESIDUAL — this shortens the window, it does not close it.** Cloudflare Git integration deploys `sites/nikatru` on the *merge push*, with no workflow involved and no GitHub check it can read. The stale sitemap is therefore **already live** and stays live until this pull request merges. On 2026-08-25 the equivalent window was 14m49s, with a human watching and acting. What this automation changes is that the repair is drafted and correct rather than remembered; a crawler arriving inside the window still sees the stale `<lastmod>`.'
            printf '%s\n\n' 'A zero window would mean pushing straight to protected `main`. That is a branch-protection change and owner work; this workflow does not attempt it.'
            printf '%s\n'   '**Review note.** This diff should be generated bytes and nothing else. If it contains anything that is not a regeneration, do not merge it — say so on the pull request instead.'
          } > "${RUNNER_TEMP}/pr-body.md"

          # THE REPAIR IS PUT SOMEWHERE DURABLE BEFORE IT IS PROPOSED. The
          # proposal is the step that can be refused; the patch is not.
          git format-patch -1 --stdout > "$OUT/site-drift-repair.patch"
          cp "${RUNNER_TEMP}/pr-body.md" "$OUT/pr-body.md"

          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"

          # ── 🔴 `gh pr create` CAN BE REFUSED, AND A REFUSAL IS NOT A REPAIR ──
          # "Allow GitHub Actions to create and approve pull requests"
          # (repository Settings → Actions → General) gates every `gh pr create`
          # run by GITHUB_TOKEN. Measured OFF on 2026-08-26
          # (`can_approve_pull_request_reviews: false`), and this call site had
          # never executed — the ten runs to date all took the no-drift path
          # above, so nothing had ever been proposed. `set -euo pipefail` alone
          # would end the job on the raw `gh` message: red, but naming a
          # permission the reader must then trace back to a checkbox. So the
          # exit code is caught, the cause is named, and the exit stays non-zero.
          set +e
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "sites: regenerate the discovery surface (automated drift repair)" \
            --body-file "${RUNNER_TEMP}/pr-body.md" > "$OUT/gh-pr-create.log" 2>&1
          PR_RC=$?
          set -e
          cat "$OUT/gh-pr-create.log"

          if [ "$PR_RC" -ne 0 ]; then
            # The patch, in the log, so a reader who cannot download artifacts
            # still has the repair in front of them.
            echo '--- THE COMPUTED REPAIR, IN FULL ---'
            cat "$OUT/site-drift-repair.patch"
            echo '--- END OF THE COMPUTED REPAIR ---'

            if grep -qiF 'not permitted to create or approve pull requests' "$OUT/gh-pr-create.log"; then
              CAUSE='the repository setting "Allow GitHub Actions to create and approve pull requests" is OFF.'
              REMEDY='REMEDY (owner work — no workflow can set this for itself): Settings → Actions → General → Workflow permissions → tick "Allow GitHub Actions to create and approve pull requests". API equivalent: gh api -X PUT "repos/'"${GITHUB_REPOSITORY}"'/actions/permissions/workflow" -F can_approve_pull_request_reviews=true'
            else
              CAUSE="gh pr create exited ${PR_RC} for a reason this step does not recognise."
              REMEDY='REMEDY: read the gh output above.'
            fi

            echo "::error title=Site drift was repaired but the pull request could not be opened::${CAUSE} THE REPAIR IS NOT LOST — branch ${BRANCH} is pushed, and the patch is both printed above and uploaded as this run's site-drift-repair artifact; open the pull request by hand from ${BRANCH} into main. ${REMEDY}"
            exit 1
          fi

      - name: Preserve the computed repair
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-drift-repair
          path: ${{ runner.temp }}/site-drift-repair/
          if-no-files-found: error

      - name: Site integrity — the repaired tree agrees with git
        run: node tooling/ci/check-site-integrity.mjs . sites/nikatru sites/rajasekarselvam
