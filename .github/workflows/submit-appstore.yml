name: "Store submit: Apple App Store"

run-name: "Store submit: Apple App Store (dry run) by @${{ github.actor }}"

# The measurements, retractions and traps behind this file are in
# docs/ci/submit-appstore.md. Only `# why:` lines live here, and
# docs/ci/README.md carries the rules every workflow has to obey.

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: read

jobs:
  gate:
    name: Require ci-gate to have passed
    runs-on: ubuntu-24.04
    # why: 25, not 10. assert-gate-passed.mjs polls for up to its own 1200 s default,
    # so any bound at or under 20 kills it mid-poll and replaces "timed out waiting
    # for ci-gate" with an opaque cancellation. Byte-identical in all five gate jobs.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require ci-gate to have passed for this commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node tooling/ci/assert-gate-passed.mjs ${{ github.sha }}

  dry-run:
    name: Validate the submission path
    runs-on: macos-26
    timeout-minutes: 30
    needs: gate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
      - name: Resolve the workspace
        run: flutter pub get --enforce-lockfile
      - name: Toolchain under test
        run: |
          sw_vers
          xcodebuild -version
          uname -m
      - name: Build iOS (unsigned — no distribution certificate exists)
        working-directory: apps/subly
        run: >
          flutter build ios --release --no-codesign
          --obfuscate --split-debug-info=build/symbols/ios
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}
          --dart-define=GLITCHTIP_DSN=${{ secrets.GLITCHTIP_DSN }}
      - name: Build macOS (unsigned — no distribution certificate exists)
        working-directory: apps/subly
        run: >
          flutter build macos --release
          --obfuscate --split-debug-info=build/symbols/macos
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}
          --dart-define=GLITCHTIP_DSN=${{ secrets.GLITCHTIP_DSN }}
      # why: both builds above are obfuscated, so their crash reports are
      # unreadable without these directories, and a rebuild produces DIFFERENT
      # ones. Retained rather than sent to the crash sink because
      # tooling/versions.json pins ONE glitchtip-cli binary and it is
      # linux-x86_64; this job runs on macOS. docs/ci/build-platforms.md
      # §obfuscation carries that residue.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: symbols-subly-appstore
          path: |
            apps/subly/build/symbols/ios
            apps/subly/build/symbols/macos
          retention-days: 90
          if-no-files-found: error
      - name: Dry-run the App Store submission (iOS)
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_CONNECT_APP_ID: ${{ secrets.APP_STORE_CONNECT_IOS_APP_ID }}
        # why: --allow-missing-artifact here and NOT on the Windows lane. No distribution
        # certificate exists, so there is no signed .ipa to validate; the Windows dry run
        # builds and packages a real .msix first and must not be given this flag.
        run: node tooling/release/submit-appstore.mjs --dry-run --channel ios-appstore --app subly --allow-missing-artifact
      - name: Dry-run the App Store submission (macOS)
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_CONNECT_APP_ID: ${{ secrets.APP_STORE_CONNECT_MACOS_APP_ID }}
        run: node tooling/release/submit-appstore.mjs --dry-run --channel macos-appstore --app subly --allow-missing-artifact
