name: "Store submit: Google Play"

run-name: "Store submit: Google Play by @${{ github.actor }}"

# The measurements, retractions and traps behind this file are in
# docs/ci/submit-play.md. Only `# why:` lines live here, and
# docs/ci/README.md carries the rules every workflow has to obey.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type SUBMIT-TO-PLAY to authorise a real upload. Anything else runs the dry run only.'
        required: true
        default: 'dry-run-only'
        type: string
      track:
        description: 'Play track. Leave empty to use the least-public track the API reports for the app. `production` is REFUSED (ADR 031 class A).'
        required: false
        default: ''
        type: string
      release_status:
        description: 'Release status on that track: completed (served to the track''s testers) or draft (uploaded, not served).'
        required: false
        default: 'completed'
        type: choice
        options: [completed, draft]
      listing_url:
        description: 'The Play listing URL this submission will be recorded against, e.g. https://play.google.com/store/apps/details?id=<applicationId>. Required for a real upload; ignored by the dry run.'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  checks: read

jobs:
  gate:
    name: Require ci-gate to have passed
    runs-on: ubuntu-24.04
    # why: 25, not 10. assert-gate-passed.mjs polls for up to its own 1200 s default,
    # so any bound at or under 20 kills it mid-poll and replaces "timed out waiting
    # for ci-gate" with an opaque cancellation. Byte-identical in all five gate jobs.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require ci-gate to have passed for this commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node tooling/ci/assert-gate-passed.mjs ${{ github.sha }}

  dry-run:
    name: Validate the submission path
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: gate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: ./.github/actions/setup-flutter
      - name: Resolve the workspace
        run: flutter pub get --enforce-lockfile
      - name: Prepare the Android upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node tooling/ci/android-signing.mjs --app subly
      - name: Build the app bundle
        working-directory: apps/subly
        run: >
          flutter build appbundle --release
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}
          --dart-define=GLITCHTIP_DSN=${{ secrets.GLITCHTIP_DSN }}
      - name: The .aab must be signed by the upload key, not the debug key
        run: >
          node tooling/ci/assert-artifact-signed.mjs
          apps/subly/build/app/outputs/bundle/release/app-release.aab
      - name: The Play screenshot set spans enough device types
        run: node tooling/ci/assert-play-device-coverage.mjs --for-submission
      - name: Every native library is aligned for a 16 KB memory page
        run: >
          node tooling/ci/assert-elf-page-alignment.mjs
          apps/subly/build/app/outputs/bundle/release/app-release.aab
      - name: Dry-run the Google Play submission
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_TRACK: ${{ vars.PLAY_TRACK }}
        run: node tooling/release/submit-play.mjs --dry-run --app subly
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: subly-android-play-aab-${{ env.ANDROID_SIGNING_POSTURE }}
          path: apps/subly/build/app/outputs/bundle/release/app-release.aab
          retention-days: 7
          if-no-files-found: error

  submit:
    name: Upload to Google Play (owner-approved)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [gate, dry-run]
    # why: a typed phrase, not a checkbox. This is the only job in the tree that
    # uploads to a public store, and the dispatch default is dry-run-only.
    if: inputs.confirm == 'SUBMIT-TO-PLAY'
    # why: this line is the owner-approval PAUSE (ADR 031 class A), and on its own it
    # FAILS OPEN -- GitHub creates a referenced environment that does not exist, with
    # no protection rules, and runs. So tooling/release/submit-play.mjs also reads the
    # environment's protection rules at run time, and assert-release-provenance.mjs
    # fails the build for a submit lane that has only one of the two halves.
    environment: store-publish
    permissions:
      contents: read
      checks: read
      deployments: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: A real submission must name the listing it will be recorded against
        env:
          LISTING_URL: ${{ inputs.listing_url }}
        run: |
          set -euo pipefail
          case "${LISTING_URL}" in
            https://*)
              echo "⬜ [10]D-9 the submission will be recorded against ${LISTING_URL}"
              ;;
            '')
              echo "FAIL the \`listing_url\` dispatch input is EMPTY, and this job is a REAL upload." >&2
              echo "     [10]D-9: a store record whose listing nobody can open says something shipped and" >&2
              echo "     gives no way to look at it. The [10]D-9 recorder refuses a store environment with" >&2
              echo "     no --listing-url, so this run could upload and then be unable to record what it did." >&2
              echo "     Re-dispatch with listing_url set, e.g." >&2
              echo "       https://play.google.com/store/apps/details?id=<applicationId>" >&2
              exit 1
              ;;
            *)
              echo "FAIL \`listing_url\` is ${LISTING_URL}, which is not an https URL." >&2
              echo "     The ledger row is the ONLY address anybody will have for this submission once the" >&2
              echo "     console is behind an account nobody can open. A value that does not resolve is a" >&2
              echo "     second source of truth, not a record." >&2
              exit 1
              ;;
          esac
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: ./.github/actions/setup-flutter
      - name: Resolve the workspace
        run: flutter pub get --enforce-lockfile
      - name: Prepare the Android upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node tooling/ci/android-signing.mjs --app subly
      - name: Build the app bundle
        working-directory: apps/subly
        run: >
          flutter build appbundle --release
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}
          --dart-define=GLITCHTIP_DSN=${{ secrets.GLITCHTIP_DSN }}
      - name: The .aab must be signed by the upload key, not the debug key
        run: >
          node tooling/ci/assert-artifact-signed.mjs
          apps/subly/build/app/outputs/bundle/release/app-release.aab
      - name: The Play screenshot set spans enough device types
        run: node tooling/ci/assert-play-device-coverage.mjs --for-submission
      - name: Every native library is aligned for a 16 KB memory page
        run: >
          node tooling/ci/assert-elf-page-alignment.mjs
          apps/subly/build/app/outputs/bundle/release/app-release.aab
      - name: Upload to Google Play
        id: upload
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_TRACK: ${{ inputs.track }}
          RELEASE_STATUS: ${{ inputs.release_status }}
          CONFIRM: ${{ inputs.confirm }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          node tooling/release/submit-play.mjs --submit --app subly
          --confirm "$CONFIRM" --status "$RELEASE_STATUS"
      # why: read-after-upload on the versionCode, which androidpublisher returns per
      # track and which the upload itself produced. The snap lane deliberately has no
      # equivalent -- no machine-readable join key exists there; docs/ci/submit-snap.md
      # records why, and warns against copying that exemption onto this lane.
      - name: The Play track must carry the bundle this job just uploaded
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          PUBSPEC_VERSION="$(node tooling/ci/assert-app-versioning.mjs --emit apps/subly | sed -n 's/^pubspec_version=//p')"
          case "${PUBSPEC_VERSION}" in
            *+*) VERSION_CODE="${PUBSPEC_VERSION##*+}" ;;
            *)
              echo "FAIL apps/subly/pubspec.yaml declares version ${PUBSPEC_VERSION} with no +<build number> suffix." >&2
              echo "     Flutter would default the versionCode to 1 and this probe would assert a number nobody" >&2
              echo "     chose. Refusing to guess is the only honest answer here." >&2
              exit 1
              ;;
          esac
          APPLICATION_ID="$(node --input-type=module -e '
          import { readFileSync } from "node:fs";
          import { readGradleApplicationId } from "./tooling/ci/read-identity.mjs";
          const rel = "apps/subly/android/app/build.gradle.kts";
          const id = readGradleApplicationId(readFileSync(rel, "utf8"), rel);
          if (!id.value) { console.error(id.missing ?? id.lost); process.exit(1); }
          process.stdout.write(id.value);
          ')"
          echo "⬜ [14]O-7 reading the Play track state for ${APPLICATION_ID}, expecting versionCode ${VERSION_CODE}"
          node tooling/ops/post-deploy-smoke.mjs --play-package "${APPLICATION_ID}" --expect "${VERSION_CODE}"
      - name: Record the submission in the [10]D-9 ledger
        if: always() && steps.upload.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LISTING_URL: ${{ inputs.listing_url }}
        run: node tooling/ci/record-deployment.mjs subly-android-play --state in_review --listing-url "$LISTING_URL"
