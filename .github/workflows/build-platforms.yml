name: Build apps

run-name: "Build apps on ${{ github.ref_name }} (${{ github.event_name }}) by @${{ github.actor }}"

# The measurements, retractions and traps behind this file are in
# docs/ci/build-platforms.md. Only `# why:` lines live here, and
# docs/ci/README.md carries the rules every workflow has to obey.

on:
  workflow_dispatch:
  push:
    tags: ['*-v*']
  # why: TWO weekly slots against a duty declared weekly. The freshness window is
  # cadence x 1.5 and GitHub delivers this repository's scheduled runs 10.1% on
  # time, so one slot a week is one chance; the margin is given to the evidence.
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
    - cron: '0 6 * * 4'   # Thursdays 06:00 UTC

permissions:
  contents: read
  checks: read

jobs:
  gate:
    name: Require ci-gate to have passed
    runs-on: ubuntu-24.04
    # why: 25, not 10. assert-gate-passed.mjs polls for up to its own 1200 s default,
    # so any bound at or under 20 kills it mid-poll and replaces "timed out waiting
    # for ci-gate" with an opaque cancellation. Byte-identical in all five gate jobs.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require ci-gate to have passed for this commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node tooling/ci/assert-gate-passed.mjs ${{ github.sha }}

  prepare:
    name: Derive the app set from the pub workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: gate
    outputs:
      apps: ${{ steps.workspace.outputs.apps }}
      GITHUB_SHA_SHORT: ${{ steps.workspace.outputs.GITHUB_SHA_SHORT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: The tag must name the version the app declares
        if: github.ref_type == 'tag'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: node tooling/ci/assert-app-versioning.mjs --tag "$REF_NAME"
      # why: DERIVED, NOT LISTED. A hand-written app list here is a second copy of the
      # workspace, and the copy is the one that rots.
      - name: The matrix comes from the workspace, never from this file
        id: workspace
        run: |
          set -euo pipefail
          apps="$(node tooling/ci/assert-release-lane-generic.mjs --emit-apps)"
          echo "apps=${apps}" >> "$GITHUB_OUTPUT"
          echo "GITHUB_SHA_SHORT=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "Building: ${apps}" >> "$GITHUB_STEP_SUMMARY"

  linux_web_android:
    name: Linux + Web + Android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.prepare.outputs.apps) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: ./.github/actions/setup-flutter
      - name: Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libsecret-1-dev libjsoncpp-dev libcurl4-openssl-dev
      - name: Resolve the workspace
        run: flutter pub get --enforce-lockfile
      - name: Derive the release line from pubspec
        id: ver
        run: node tooling/ci/assert-app-versioning.mjs --emit apps/${{ matrix.app }} >> "$GITHUB_OUTPUT"
      - name: Build web
        working-directory: apps/${{ matrix.app }}
        run: >
          flutter build web --release
          --dart-define=GLITCHTIP_DSN=${{ secrets.GLITCHTIP_DSN }}
      # why: --obfuscate and --split-debug-info are ONE flag, and the directory
      # they write is the ONLY thing that turns a crash report from this build
      # back into source. A rebuild produces a DIFFERENT mapping, so it leaves
      # this runner or it is gone. Both destinations are wired below and
      # tooling/ci/assert-obfuscation-coupled.mjs refuses the pair being split.
      # Web is absent from this deliberately: Flutter does not support
      # obfuscation on web at all, and deploy-web.yml carries web's own
      # --source-maps path. docs/ci/build-platforms.md §obfuscation.
      - name: Build linux
        working-directory: apps/${{ matrix.app }}
        run: >
          flutter build linux --release
          --obfuscate --split-debug-info=build/symbols/linux
          --build-name=${{ steps.ver.outputs.release_line }}.${{ github.run_number }}
          --dart-define=APP_VERSION=${{ steps.ver.outputs.release_line }}.${{ github.run_number }}+${{ needs.prepare.outputs.GITHUB_SHA_SHORT }}
          --dart-define=RELEASE_CHANNEL=linux-appimage
          --dart-define=GLITCHTIP_DSN=${{ secrets.GLITCHTIP_DSN }}
      - name: Prepare the AppImage signing key
        env:
          APPIMAGE_SIGNING_KEY_B64: ${{ secrets.APPIMAGE_SIGNING_KEY_B64 }}
        run: node tooling/ci/appimage-signing.mjs --app ${{ matrix.app }}
      - name: Generate the snapcraft recipe
        run: >
          node tooling/release/generate-snapcraft.mjs
          --app ${{ matrix.app }}
          --bundle apps/${{ matrix.app }}/build/linux/x64/release/bundle
          --out "$RUNNER_TEMP/snapcraft-${{ matrix.app }}"
          --version ${{ steps.ver.outputs.release_line }}.${{ github.run_number }}
      - name: The generated recipe is complete and still derived from the tree
        run: >
          node tooling/ci/assert-snapcraft-generable.mjs
          --emitted "$RUNNER_TEMP/snapcraft-${{ matrix.app }}/snap/snapcraft.yaml"
          --app ${{ matrix.app }}
      - name: Prepare the Android upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node tooling/ci/android-signing.mjs --app ${{ matrix.app }}
      - name: Build android (apk — sideloadable build proof)
        working-directory: apps/${{ matrix.app }}
        run: >
          flutter build apk --release
          --obfuscate --split-debug-info=build/symbols/android-apk
          --build-name=${{ steps.ver.outputs.release_line }}.${{ github.run_number }}
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}
          --dart-define=APP_VERSION=${{ steps.ver.outputs.release_line }}.${{ github.run_number }}+${{ needs.prepare.outputs.GITHUB_SHA_SHORT }}
          --dart-define=RELEASE_CHANNEL=android-play
          --dart-define=GLITCHTIP_DSN=${{ secrets.GLITCHTIP_DSN }}
      - name: Build android (aab — the Google Play artifact)
        working-directory: apps/${{ matrix.app }}
        run: >
          flutter build appbundle --release
          --obfuscate --split-debug-info=build/symbols/android-aab
          --build-name=${{ steps.ver.outputs.release_line }}.${{ github.run_number }}
          --build-number=${{ github.run_number }}
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}
          --dart-define=APP_VERSION=${{ steps.ver.outputs.release_line }}.${{ github.run_number }}+${{ needs.prepare.outputs.GITHUB_SHA_SHORT }}
          --dart-define=RELEASE_CHANNEL=android-play
          --dart-define=GLITCHTIP_DSN=${{ secrets.GLITCHTIP_DSN }}
      - name: The .aab must be signed by the upload key, not the debug key
        run: >
          node tooling/ci/assert-artifact-signed.mjs
          apps/${{ matrix.app }}/build/app/outputs/bundle/release/app-release.aab
      - name: Every artifact this lane claims exists, and is not empty
        run: >
          node tooling/ci/assert-artifact-shape.mjs
          --app ${{ matrix.app }} --platform linux_web_android
      - name: Every native library is aligned for a 16 KB memory page
        run: >
          node tooling/ci/assert-elf-page-alignment.mjs
          apps/${{ matrix.app }}/build/app/outputs/bundle/release/app-release.aab
      # why: pinned by version AND by digest, byte-identical to deploy-web.yml's
      # step. The release asset is a GitLab JOB ARTIFACT, which is a re-runnable
      # address rather than an immutable object — so the version alone is a
      # label, and the digest is what makes it an address. Both halves live in
      # tooling/versions.json.
      - name: Install glitchtip-cli (pinned by version AND by digest)
        run: |
          set -euo pipefail
          ver="$(node -p "require('./tooling/versions.json').glitchtip_cli")"
          sum="$(node -p "require('./tooling/versions.json').glitchtip_cli_sha256")"
          url="https://gitlab.com/glitchtip/glitchtip-cli/-/jobs/artifacts/v${ver}/raw/artifacts/glitchtip-cli-linux-x86_64?job=build-linux-x86_64"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --output "${RUNNER_TEMP}/glitchtip-cli" "$url"
          printf '%s  %s\n' "$sum" "${RUNNER_TEMP}/glitchtip-cli" | sha256sum --check --strict -
          chmod +x "${RUNNER_TEMP}/glitchtip-cli"
          got="$("${RUNNER_TEMP}/glitchtip-cli" --version)"
          if [ "$got" != "glitchtip-cli ${ver}" ]; then
            echo "::error title=glitchtip-cli::the pinned binary reports \"${got}\", not \"glitchtip-cli ${ver}\""
            exit 1
          fi
          echo "$got"
      # why: FAILS CLOSED on a missing GLITCHTIP_TOKEN, never skips. The wrapper
      # exists because `debug-files upload` exits 0 over an empty directory, over
      # failed chunks and over an assembly that never completed — its header
      # names all three and the source lines they were read from.
      - name: Upload the native debug symbols to GlitchTip
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.GLITCHTIP_TOKEN }}
          GLITCHTIP_DSN: ${{ secrets.GLITCHTIP_DSN }}
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          for lane in linux android-apk android-aab; do
            node tooling/ops/upload-native-symbols.mjs \
              --cli "${RUNNER_TEMP}/glitchtip-cli" \
              --dir "apps/${APP}/build/symbols/${lane}" \
              --org nikatru --project "$APP"
          done
      # why: the crash sink is where the symbols are READ, and this artifact is
      # what survives the sink losing them. Named `symbols-*` on purpose: the
      # `release` job downloads `<app>-*` and publishes it, and an obfuscation
      # mapping attached to a public GitHub Release un-obfuscates the build for
      # everyone. 90 days matches the installable artifacts beside it.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: symbols-${{ matrix.app }}-linux-android
          path: |
            apps/${{ matrix.app }}/build/symbols/linux
            apps/${{ matrix.app }}/build/symbols/android-apk
            apps/${{ matrix.app }}/build/symbols/android-aab
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.app }}-linux-web-android-${{ env.ANDROID_SIGNING_POSTURE }}
          path: |
            apps/${{ matrix.app }}/build/app/outputs/flutter-apk/*.apk
            apps/${{ matrix.app }}/build/app/outputs/bundle/release/*.aab
            apps/${{ matrix.app }}/build/linux/x64/release/bundle
          retention-days: 90
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-2025
    timeout-minutes: 30
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.prepare.outputs.apps) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
      - name: Resolve the workspace
        run: flutter pub get --enforce-lockfile
      - name: Derive the release line from pubspec
        id: ver
        shell: bash
        run: node tooling/ci/assert-app-versioning.mjs --emit apps/${{ matrix.app }} >> "$GITHUB_OUTPUT"
      - name: Build windows
        working-directory: apps/${{ matrix.app }}
        run: >
          flutter build windows --release
          --obfuscate --split-debug-info=build/symbols/windows
          --build-name=${{ steps.ver.outputs.release_line }}.${{ github.run_number }}
          --build-number=${{ github.run_number }}
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}
          --dart-define=APP_VERSION=${{ steps.ver.outputs.release_line }}.${{ github.run_number }}+${{ needs.prepare.outputs.GITHUB_SHA_SHORT }}
          --dart-define=RELEASE_CHANNEL=windows-store
          --dart-define=GLITCHTIP_DSN=${{ secrets.GLITCHTIP_DSN }}
      - name: Package MSIX (Microsoft Store)
        working-directory: apps/${{ matrix.app }}
        run: dart run msix:create
      # why: the artifact is preserved BEFORE the identity check that can reject it. A
      # refusal must leave the evidence behind, not delete it.
      - name: Keep the .msix even if what follows refuses it
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.app }}-windows-msix-diagnostic
          path: apps/${{ matrix.app }}/build/windows/msix/*.msix
          retention-days: 14
          if-no-files-found: warn
      - name: The MSIX carries the identity the register declares
        shell: bash
        run: >
          node tooling/ci/assert-artifact-signed-msix.mjs
          apps/${{ matrix.app }}/build/windows/msix/${{ matrix.app }}.msix
      - name: Prepare the Windows code-signing certificate, and read the signature back
        shell: bash
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
        run: >
          node tooling/ci/windows-signing.mjs --app ${{ matrix.app }}
          $(for f in apps/${{ matrix.app }}/build/windows/x64/runner/Release/*.exe
          apps/${{ matrix.app }}/build/windows/x64/runner/Release/*.dll; do
          if [ -e "$f" ]; then printf -- '--artifact %s ' "$f"; fi; done)
      - name: Every artifact this lane claims exists, and is not empty
        run: >
          node tooling/ci/assert-artifact-shape.mjs
          --app ${{ matrix.app }} --platform windows
      # why: retained as an artifact and NOT uploaded to the crash sink, because
      # tooling/versions.json pins ONE glitchtip-cli binary and it is
      # linux-x86_64. Arming this runner would mean a second pinned binary and a
      # second digest; until then the 90-day artifact is the mapping's only copy
      # and this step is what stops it being lost. Recorded in
      # docs/ci/build-platforms.md §obfuscation as an open residue, not a gap
      # nobody noticed.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: symbols-${{ matrix.app }}-windows
          path: |
            apps/${{ matrix.app }}/build/symbols/windows
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.app }}-windows
          path: |
            apps/${{ matrix.app }}/build/windows/x64/runner/Release
            apps/${{ matrix.app }}/build/windows/msix/*.msix
          retention-days: 90
          if-no-files-found: error

  apple:
    name: macOS + iOS
    runs-on: macos-26
    timeout-minutes: 30
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.prepare.outputs.apps) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
      - name: Resolve the workspace
        run: flutter pub get --enforce-lockfile
      - name: Toolchain under test
        run: |
          sw_vers
          xcodebuild -version
          flutter --version
      - name: The Xcode floor is met, not just declared
        run: node tooling/ci/assert-xcode-floor.mjs
      - name: Patch the SDK for flutter/flutter#188060 (macOS AOT abort)
        run: python3 tooling/ci/patch-flutter-macos-aot.py "$FLUTTER_ROOT"
      - name: Prepare the Apple distribution identity
        env:
          APPLE_DIST_CERT_P12_BASE64: ${{ secrets.APPLE_DIST_CERT_P12_BASE64 }}
          APPLE_DIST_CERT_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
          APPLE_PROVISIONING_PROFILES_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILES_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node tooling/ci/apple-signing.mjs --app ${{ matrix.app }}
      - name: Build macos
        working-directory: apps/${{ matrix.app }}
        run: >
          flutter build macos --release
          --obfuscate --split-debug-info=build/symbols/macos
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}
          --dart-define=GLITCHTIP_DSN=${{ secrets.GLITCHTIP_DSN }}
      - name: The macOS bundle is signed by the identity this lane intended
        run: >
          node tooling/ci/assert-artifact-signed-apple.mjs
          apps/${{ matrix.app }}/build/macos/Build/Products/Release/*.app
      - name: Build ios (no codesign)
        working-directory: apps/${{ matrix.app }}
        run: >
          flutter build ios --release --no-codesign
          --obfuscate --split-debug-info=build/symbols/ios
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}
          --dart-define=GLITCHTIP_DSN=${{ secrets.GLITCHTIP_DSN }}
      - name: The iOS bundle is signed by the identity this lane intended
        run: >
          node tooling/ci/assert-artifact-signed-apple.mjs
          apps/${{ matrix.app }}/build/ios/iphoneos/*.app
      - name: Every artifact this lane claims exists, and is not empty
        run: >
          node tooling/ci/assert-artifact-shape.mjs
          --app ${{ matrix.app }} --platform apple
      # why: same reason as the windows lane — one pinned glitchtip-cli binary,
      # and it is linux-x86_64. The .symbols directories are the only copy of
      # each mapping, so they are retained for the same 90 days as the bundles.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: symbols-${{ matrix.app }}-apple
          path: |
            apps/${{ matrix.app }}/build/symbols/macos
            apps/${{ matrix.app }}/build/symbols/ios
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.app }}-macos
          path: apps/${{ matrix.app }}/build/macos/Build/Products/Release
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.app }}-ios-${{ env.APPLE_SIGNING_POSTURE }}
          path: apps/${{ matrix.app }}/build/ios/iphoneos
          retention-days: 90
          if-no-files-found: error

  all_platforms:
    name: all-platforms
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # why: this aggregate treats 'skipped' as not-green as well as failure and
    # cancelled. A job-level if: on any platform job would otherwise let it print
    # "All 6 platforms built" over a platform that never built.
    needs: [gate, prepare, linux_web_android, windows, apple, release]
    if: always()
    steps:
      - name: Require every platform green
        run: |
          echo "gate=${{ needs.gate.result }} prepare=${{ needs.prepare.result }} linux_web_android=${{ needs.linux_web_android.result }} windows=${{ needs.windows.result }} apple=${{ needs.apple.result }} release=${{ needs.release.result }}"
          # 'skipped' added by review 2026-07-31: a job-level `if:` on any
          # platform job would otherwise let this print "All 6 platforms built"
          # over a platform that never built.
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ] || [ "${{ contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "::error::One or more platform builds failed"; exit 1
          fi
          echo "All 6 platforms built"

  release:
    name: Durable release artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs:
      - gate
      - prepare
      - linux_web_android
      - windows
      - apple
    permissions:
      contents: write
      deployments: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.prepare.outputs.apps) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: downloads
          pattern: ${{ matrix.app }}-*
      - name: Stage the installers and archive the rest
        env:
          APP: ${{ matrix.app }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          else
            TAG="${APP}-untagged-$(git rev-parse --short HEAD)"
          fi
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"
          # AUTHORITATIVE, and it sits here rather than after `--stage` because
          # this is the last moment the installers still carry their build names:
          # `--stage` renames every one of them after $TAG. `set -euo pipefail`
          # above is what makes a non-zero exit fail the job.
          # UNCONDITIONAL on purpose — on a non-tag run $TAG is the
          # `<app>-untagged-<sha>` value synthesised two lines up, which the guard
          # treats as a no-op, so every dispatch and every scheduled run still
          # exercises the parse and proves the code loads. Gating this on
          # `ref_type == 'tag'` would leave it dead until the first real release.
          node tooling/ci/assert-app-versioning.mjs --tag "$TAG"
          mkdir -p dist
          node tooling/ci/release-manifest.mjs --stage downloads --out dist --app "$APP" --tag "$TAG"
          for d in downloads/*/; do
            [ -d "$d" ] || continue
            n="$(basename "$d")"
            if [ -z "$(find "$d" -type f -print -quit)" ]; then
              echo "skip  ${n} — every file in it was staged as an installer"
              continue
            fi
            tar -czf "dist/${TAG}-${n}.tar.gz" -C "$d" .
            echo "archived  ${TAG}-${n}.tar.gz"
          done
      - name: Write the checksum manifest, naming the gated commit
        env:
          APP: ${{ matrix.app }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >
          node tooling/ci/release-manifest.mjs --write dist
          --app "$APP" --tag "$RELEASE_TAG" --sha "$GITHUB_SHA" --run-url "$RUN_URL"
      # why: written and then re-read. A manifest checked only by the process that wrote
      # it proves the writer was self-consistent, not that the assets on disk match.
      - name: Re-verify every asset against the manifest
        run: >
          node tooling/ci/release-manifest.mjs --verify dist
          --expect-formats --for-workflow .github/workflows/build-platforms.yml
      - name: Publish the GitHub Release (tag pushes only)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "Built from commit \`${GITHUB_SHA}\`, which passed \`ci-gate\` before any binary in this release existed."
            echo
            echo "Verify every download with a tool you already have:"
            echo
            echo "    sha256sum -c SHA256SUMS"
            echo
            echo "Produced by ${RUN_URL}"
          } > dist-notes.md
          gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file dist-notes.md $(node tooling/ci/release-manifest.mjs --emit-assets dist)
          echo "RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url --jq .url)" >> "$GITHUB_ENV"
      - name: The release must carry the assets this job just uploaded
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "⬜ [14]O-7 reading back the release ${REPO}@${RELEASE_TAG}"
          node tooling/ops/post-deploy-smoke.mjs --release-repo "$REPO" --release-tag "$RELEASE_TAG" --release-manifest dist/SHA256SUMS
      - name: Record what shipped, per channel this release is the origin for
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          for environment in $(node tooling/ci/release-manifest.mjs --emit-environments dist --app "$APP"); do
            node tooling/ci/record-deployment.mjs "$environment" "$RELEASE_URL"
          done
