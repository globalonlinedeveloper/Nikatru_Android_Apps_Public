name: E2E live

run-name: "E2E live against ${{ inputs.auth_target || 'hosted' }} auth (${{ github.event_name }})"

# The measurements, retractions and traps behind this file are in
# docs/ci/e2e.md. Only `# why:` lines live here, and
# docs/ci/README.md carries the rules every workflow has to obey.

on:
  workflow_dispatch:
    inputs:
      # why: ONE SUITE, TWO AUTH TARGETS, AND THE NIGHTLY NEVER MOVES. The
      # cutover's blocker was that the live suite could only ever be run against
      # the auth project it was already pointed at, so "does this still pass on
      # Box A" could only be answered inside the cutover window itself. This
      # input answers it on demand, from the same code, before the window.
      # `hosted` stays the default and the schedule below carries no input at
      # all, so the unattended proof keeps grading production.
      auth_target:
        description: 'Which auth stack to run against: hosted Supabase, or Box A (self-hosted GoTrue).'
        type: choice
        required: false
        default: hosted
        options:
          - hosted
          - boxa
  # why: 03:17, computed rather than chosen -- including the wrap past midnight,
  # which a sorted list of slots never shows. This lane runs against LIVE Supabase,
  # the live Worker and live D1, so a red night may mean production is broken.
  schedule:
    - cron: '17 3 * * *' # 03:17 UTC nightly

permissions:
  contents: read

jobs:
  prepare:
    name: Derive the app set from the pub workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      apps: ${{ steps.workspace.outputs.apps }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # why: DERIVED, NOT LISTED. A hand-written app list here is a second copy of the
      # workspace, and the copy is the one that rots toward looking healthier.
      - name: The matrix comes from the workspace, never from this file
        id: workspace
        run: |
          set -euo pipefail
          apps="$(node tooling/ci/assert-release-lane-generic.mjs --emit-apps)"
          echo "apps=${apps}" >> "$GITHUB_OUTPUT"
          echo "Driving: ${apps}" >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: Flutter integration_test (live Supabase + D1)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.prepare.outputs.apps) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # why: THE TARGET IS RESOLVED HERE AND NOWHERE ELSE, AND IT FAILS CLOSED.
      # A GitHub `A && B || C` ternary cannot carry this: an EMPTY BOXA_* secret
      # is falsey, so the ternary would silently hand back the hosted value and
      # the run would report "boxa" in its name while grading production. That
      # is the exact false green this lane exists to refuse. So the choice is
      # made in shell, each of the three names is checked for emptiness by
      # itself, and a missing one ENDS the job naming the secret — never a skip,
      # never a fallback.
      - name: Preflight — the chosen auth target's secrets must be present
        id: pre
        env:
          TARGET: ${{ inputs.auth_target || 'hosted' }}
          HOSTED_URL: ${{ secrets.SUPABASE_URL }}
          HOSTED_ANON: ${{ secrets.SUPABASE_ANON_KEY }}
          HOSTED_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BOXA_URL: ${{ secrets.BOXA_SUPABASE_URL }}
          BOXA_ANON: ${{ secrets.BOXA_SUPABASE_ANON_KEY }}
          BOXA_KEY: ${{ secrets.BOXA_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -uo pipefail
          missing=''
          # why: the emptiness of each SECRET is tested BY NAME, not through a
          # shell alias for it. assert-green-means-ran.mjs section B recognises a
          # secret-presence check by finding `-z "$VAR"` for a var this step's
          # `env:` bound to `secrets.*` — indirecting through `key="$HOSTED_KEY"`
          # first makes the preflight invisible to it, and an invisible preflight
          # is how e2e.yml green-skipped its own body once already.
          if [ "$TARGET" = 'hosted' ]; then
            prefix=SUPABASE
            url="$HOSTED_URL"; anon="$HOSTED_ANON"; key="$HOSTED_KEY"
            if [ -z "$HOSTED_URL" ];  then missing="${missing} SUPABASE_URL"; fi
            if [ -z "$HOSTED_ANON" ]; then missing="${missing} SUPABASE_ANON_KEY"; fi
            if [ -z "$HOSTED_KEY" ];  then missing="${missing} SUPABASE_SERVICE_ROLE_KEY"; fi
          elif [ "$TARGET" = 'boxa' ]; then
            prefix=BOXA_SUPABASE
            url="$BOXA_URL"; anon="$BOXA_ANON"; key="$BOXA_KEY"
            if [ -z "$BOXA_URL" ];  then missing="${missing} BOXA_SUPABASE_URL"; fi
            if [ -z "$BOXA_ANON" ]; then missing="${missing} BOXA_SUPABASE_ANON_KEY"; fi
            if [ -z "$BOXA_KEY" ];  then missing="${missing} BOXA_SUPABASE_SERVICE_ROLE_KEY"; fi
          else
            echo "::error title=E2E cannot run::auth_target \"$TARGET\" is not one of hosted, boxa."
            exit 1
          fi
          if [ -n "$missing" ]; then
            echo "::error title=E2E cannot run::auth_target=${TARGET} needs${missing}, and it is not set. The end-to-end proof did NOT run — this is a failed run, not a skipped one. Add or re-add the secret in Settings → Secrets and variables → Actions."
            exit 1
          fi
          {
            echo "E2E_AUTH_TARGET=${TARGET}"
            echo "SUPABASE_URL=${url}"
            echo "SUPABASE_ANON_KEY=${anon}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${key}"
          } >> "$GITHUB_ENV"
          echo "auth_target=${TARGET}: ${prefix}_URL, ${prefix}_ANON_KEY and ${prefix}_SERVICE_ROLE_KEY are all present — running the live suite."
          echo "Auth target: **${TARGET}** (${prefix}_*)" >> "$GITHUB_STEP_SUMMARY"

      - name: Stamp this run's build identity (APP_VERSION)
        run: |
          set -euo pipefail
          echo "E2E_APP_VERSION=e2e-${{ github.run_number }}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "This run stamps app_version=e2e-${{ github.run_number }}-${GITHUB_SHA::7} on every row it writes."

      - uses: ./.github/actions/setup-node

      - uses: ./.github/actions/setup-flutter

      - name: Set up ChromeDriver
        uses: nanasess/setup-chromedriver@e913548694400f275b4070efcd90f47dbbc8914c # v3.0.0

      - name: flutter pub get
        working-directory: apps/${{ matrix.app }}
        run: flutter pub get --enforce-lockfile

      # why: SUPABASE_URL / SUPABASE_ANON_KEY / SUPABASE_SERVICE_ROLE_KEY are NOT
      # read from `secrets.` in the steps below any more. The preflight resolved
      # them for the chosen target and wrote them to $GITHUB_ENV under those same
      # three names, so a step that re-declared them from `secrets.` would
      # silently override the resolution and run `boxa` against hosted.
      - name: Provision throwaway confirmed user
        id: user
        run: node tooling/e2e/provision_user.mjs

      - name: Provision the throwaway user the delete leg destroys
        id: delete_user
        run: node tooling/e2e/provision_user.mjs

      # why: THE ANSWER TO runbook §4.6's "expected, NOT YET MEASURED", taken on
      # every run rather than once. Shipping TURNSTILE_SITE_KEY to the web build
      # ahead of the cutover is safe only if a hosted GoTrue IGNORES a captcha
      # token it never asked for; on Box A the same request must be REFUSED.
      # Both are positive expectations, and the script asserts the one that
      # belongs to this run's target, so neither half can rot unobserved.
      - name: Measure the target's captcha posture (ignores it, or enforces it)
        run: node tooling/e2e/captcha_posture.mjs

      - name: Run integration tests (headless Chrome)
        id: drive
        working-directory: apps/${{ matrix.app }}
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          # why: a repository VARIABLE, not a secret. The Turnstile SITE key is
          # public by design — it ships inside the web bundle and is meaningless
          # without the secret half, which lives only on Box A. Unset today, so
          # the define arrives empty, TurnstileGate renders SizedBox.shrink()
          # and the suite behaves exactly as it did before this line existed.
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          E2E_EMAIL: ${{ steps.user.outputs.email }}
          E2E_PASSWORD: ${{ steps.user.outputs.password }}
          E2E_DELETE_EMAIL: ${{ steps.delete_user.outputs.email }}
          E2E_DELETE_PASSWORD: ${{ steps.delete_user.outputs.password }}
          E2E_TOKEN_HASH: ${{ steps.user.outputs.token_hash }}
          E2E_DELETE_TOKEN_HASH: ${{ steps.delete_user.outputs.token_hash }}
        run: |
          set -euo pipefail
          export CHROME_EXECUTABLE="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser)"
          echo "Chrome: $CHROME_EXECUTABLE"
          chromedriver --port=4444 &
          CHROMEDRIVER_PID=$!
          sleep 3
          # tee'd, not just printed: the step below turns the assertion into a
          # GitHub annotation, and `pipefail` (set above) keeps flutter's exit
          # code as the pipeline's, so teeing cannot mask a failure.
          # 🔴 `--web-port=3000` IS LOAD-BEARING, NOT TIDINESS. [pipeline N-6 leg 6]
          #
          # `flutter drive -d web-server` otherwise serves the app on
          # http://localhost:<RANDOM port>, and every Worker call the suite makes
          # is therefore cross-origin. api.nikatru.com tolerates that: its CORS
          # middleware carries an explicit localhost-any-port exception
          # (services/subly-api/src/middleware/cors.ts:38) added as the INC13 fix,
          # which is why legs 1-2 have always passed.
          #
          # The SHARED platform Worker deliberately does NOT carry that exception
          # — the same file says so in as many words: "It is a PER-APP trade: the
          # shared platform Worker deliberately does not carry it." Its allowlist
          # is exact origins only (services/platform/wrangler.jsonc:48), and the
          # one localhost entry there is the FIXED port 3000.
          #
          # Leg 6 is the first golden-path leg that calls the platform Worker
          # from the browser (`DELETE /v1/account` — the erasure entry point), so
          # it is the first thing a random port breaks. Measured 2026-08-09
          # against the deployed Worker:
          #   Origin: http://localhost:42389 -> preflight 204, NO allow-origin
          #   Origin: http://localhost:3000  -> preflight 204, allow-origin echoed,
          #                                     allow-methods GET, POST, DELETE, OPTIONS
          # The browser blocked the real request, the app never saw a status, and
          # the outcome resolved to `unknown` — "we cannot tell how much of it was
          # removed" — which is exactly what run 31290922922 printed on screen.
          #
          # Pinning the port makes the suite serve from an origin production
          # ALREADY allows, so nothing about the platform Worker's posture
          # changes. `localhost` and not `127.0.0.1`: only the former is on the
          # list (measured — 127.0.0.1:3000 gets no allow-origin), and
          # `--web-hostname` already defaults to localhost.
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/app_test.dart \
            -d web-server --web-port=3000 --browser-name=chrome \
            --web-browser-flag=--headless=new \
            --web-browser-flag=--disable-gpu \
            --web-browser-flag=--no-sandbox \
            --web-browser-flag=--disable-dev-shm-usage \
            --web-browser-flag=--window-size=430,932 \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=APP_VERSION="$E2E_APP_VERSION" \
            --dart-define=E2E_EMAIL="$E2E_EMAIL" \
            --dart-define=E2E_PASSWORD="$E2E_PASSWORD" \
            --dart-define=E2E_DELETE_EMAIL="$E2E_DELETE_EMAIL" \
            --dart-define=E2E_TOKEN_HASH="$E2E_TOKEN_HASH" \
            --dart-define=E2E_DELETE_TOKEN_HASH="$E2E_DELETE_TOKEN_HASH" \
            --dart-define=TURNSTILE_SITE_KEY="$TURNSTILE_SITE_KEY" \
            --dart-define=E2E_AUTH_TARGET="$E2E_AUTH_TARGET" \
            --dart-define=E2E_DELETE_PASSWORD="$E2E_DELETE_PASSWORD" 2>&1 | tee "${RUNNER_TEMP}/drive.log"
          kill "$CHROMEDRIVER_PID" || true

      - name: Surface the failing assertion
        if: failure() && steps.drive.outcome == 'failure'
        run: |
          set -uo pipefail
          log="${RUNNER_TEMP}/drive.log"
          if [ ! -s "$log" ]; then
            echo "::error title=E2E failed before the suite ran::flutter drive produced no output — the failure is above this step (build, chromedriver or dart-define)."
            exit 0
          fi
          # One line per failing test, plus the first assertion line under it.
          # `Failure in method:` is flutter_driver's own heading for the decoded
          # blob, so this reads the human-readable half, not the JSON.
          grep -E '^(Failure in method:|Expected:|  Actual:|   Which:)' "$log" \
            | head -40 > "${RUNNER_TEMP}/why.txt" || true
          if [ ! -s "${RUNNER_TEMP}/why.txt" ]; then
            echo "::error title=E2E failed::The suite failed but no assertion heading was found in the driver output — open the 'Run integration tests' log and the e2e-screenshots artifact."
            exit 0
          fi
          while IFS= read -r line; do
            case "$line" in
              'Failure in method:'*) echo "::error title=E2E test failed::${line}" ;;
              *) echo "::error::${line}" ;;
            esac
          done < "${RUNNER_TEMP}/why.txt"
          {
            echo '### Nightly E2E — failing assertions'
            echo ''
            echo '```'
            cat "${RUNNER_TEMP}/why.txt"
            echo '```'
            echo ''
            echo 'Screenshots up to the failure are in the `e2e-screenshots` artifact on this run.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the row landed in live D1
        env:
          E2E_USER_ID: ${{ steps.user.outputs.user_id }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUBLY_D1_DATABASE_ID: 88da9026-f72a-4cda-823d-431148fa8112
        run: node tooling/e2e/verify_row.mjs

      # why: THE ONE-ISSUER FACT, ASSERTED IN BOTH DIRECTIONS RATHER THAN SKIPPED.
      # The Workers trust exactly one issuer (runbook Phase 5), so a Box A-minted
      # JWT must be REFUSED by the deployed Worker until the cutover moves that
      # issuer — and a hosted-minted one must be accepted. Running this on every
      # target means the boxa expectation is exercised code, not a comment, and
      # the day it flips the run says so instead of a golden-path leg going red
      # for a reason nobody can read off the screenshot.
      - name: The Workers trust exactly one issuer (positive, both targets)
        env:
          E2E_EMAIL: ${{ steps.user.outputs.email }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: node tooling/e2e/assert_one_issuer.mjs

      - name: Verify the in-app deletion really purged (leg 6)
        env:
          E2E_DELETE_USER_ID: ${{ steps.delete_user.outputs.user_id }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUBLY_D1_DATABASE_ID: 88da9026-f72a-4cda-823d-431148fa8112
        run: node tooling/e2e/verify_purged.mjs

      - name: Verify the consent artifact landed in platform_db
        env:
          E2E_APP_ID: ${{ matrix.app }}
          E2E_RESPONSE_DATA: apps/${{ matrix.app }}/build/integration_response_data.json
          E2E_DRIVE_LOG: ${{ runner.temp }}/drive.log
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PLATFORM_D1_DATABASE_ID: 9d1c5c63-97fe-4f82-bc7d-f3fd22e9b351
        run: node tooling/e2e/verify_consent.mjs

      - name: Upload per-page screenshots
        if: always() && steps.user.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-screenshots-${{ matrix.app }}
          path: apps/${{ matrix.app }}/screenshots/
          if-no-files-found: warn

      # why: always(), because this lane writes into PRODUCTION Supabase and live D1. A
      # failed run that skipped its own cleanup leaves the rows behind.
      - name: Purge test data (always — keep prod pristine)
        if: always() && steps.user.outcome != 'skipped'
        env:
          E2E_USER_ID: ${{ steps.user.outputs.user_id }}
          E2E_APP_ID: ${{ matrix.app }}
          E2E_RESPONSE_DATA: apps/${{ matrix.app }}/build/integration_response_data.json
          E2E_DRIVE_LOG: ${{ runner.temp }}/drive.log
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUBLY_D1_DATABASE_ID: 88da9026-f72a-4cda-823d-431148fa8112
          PLATFORM_D1_DATABASE_ID: 9d1c5c63-97fe-4f82-bc7d-f3fd22e9b351
        run: node tooling/e2e/purge.mjs

      - name: Purge the delete-leg user too (already gone on a green run)
        if: always() && steps.delete_user.outcome != 'skipped'
        env:
          E2E_USER_ID: ${{ steps.delete_user.outputs.user_id }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUBLY_D1_DATABASE_ID: 88da9026-f72a-4cda-823d-431148fa8112
        run: node tooling/e2e/purge.mjs

  alert:
    name: Open or refresh the nightly-failure issue
    needs: e2e
    # why: schedule only. A dispatched red is somebody already watching; an unattended
    # red is the one nobody sees. The issue is REUSED and never auto-closed --
    # closing it is the acknowledgement that a human looked.
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: File the failure against one durable issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TITLE: 'Nightly E2E (live) is failing against production'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          note="Failed: [run ${GITHUB_RUN_ID}, attempt ${GITHUB_RUN_ATTEMPT}](${RUN_URL}) at $(date -u '+%Y-%m-%d %H:%M UTC')."

          # Quoted heredoc on purpose — the body is markdown full of backticks,
          # and an unquoted one would execute them as commands. The body lines
          # below sit at the block scalar's own indent, which YAML strips, so the
          # heredoc terminator really is at column 0 by the time bash sees it.
          body="${RUNNER_TEMP}/e2e-alert.md"
          { printf '%s\n\n' "$note"; cat <<'BODY'
          The nightly **E2E (live)** run is red. It runs unattended at 03:17 UTC against
          LIVE Supabase auth, the live Cloudflare Worker and live D1 — so a failure may
          mean the deployed Subly app is broken for real users, not merely that a test
          is flaky. Treat it as production until proven otherwise.

          **This issue is reused.** Every later nightly failure is added here as a
          comment instead of opening a new issue, and it is not closed automatically.
          It stays open until a human closes it; closing it *is* the acknowledgement
          that someone looked.

          Where to start:
          - the red **annotations at the top of the run page** — the `Surface the failing
            assertion` step lifts the failing test name and its `Expected/Actual` out of
            the driver's one-line JSON blob, so the actual assertion is readable without
            opening the log
          - the failing step in the run linked above
          - the `e2e-screenshots` artifact attached to that run — one screenshot per page
          - whether `Purge test data` still ran (it is `if: always()`), or a throwaway
            user and its D1 rows are now stranded in production
          - re-run via **Actions → E2E (live) → Run workflow** to tell a real regression
            apart from a flake

          Filed automatically by the `alert` job in `.github/workflows/e2e.yml`.
          BODY
          } > "$body"

          # Looked up through the LIST api, not the search index: search lags
          # behind writes, and a lookup that misses opens a duplicate.
          existing="$(gh issue list --state open --limit 200 --json number,title \
            --jq '[.[] | select(.title == env.TITLE) | .number] | first // empty')"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still red. ${note}"
            url="${GITHUB_SERVER_URL}/${GH_REPO}/issues/${existing}"
            echo "::warning title=Nightly E2E still failing::commented on the already-open issue #${existing}"
          else
            url="$(gh issue create --title "$TITLE" --body-file "$body")"
            echo "::error title=Nightly E2E failed::opened ${url}"
          fi

          echo "Nightly E2E failure tracked at ${url}" >> "$GITHUB_STEP_SUMMARY"
