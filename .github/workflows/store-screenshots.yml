name: Store screenshots

run-name: "Store screenshots by @${{ github.actor }}"

# The measurements, retractions and traps behind this file are in
# docs/ci/store-screenshots.md. Only `# why:` lines live here, and
# docs/ci/README.md carries the rules every workflow has to obey.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    name: Capture the Play phone and tablet screenshot sets (live)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # why: FAILS CLOSED on a missing secret rather than skipping. Without all four the
      # app builds in DEMO posture -- every screen carries a "Demo data" banner and the
      # board is twelve third-party trademarks, which is a store filing nobody can ship.
      - name: Preflight — every secret the live capture needs must be present
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=""
          for k in SUPABASE_URL SUPABASE_ANON_KEY API_BASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            eval "v=\$$k"
            [ -z "$v" ] && missing="$missing $k"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Capture cannot run::Missing secret(s):$missing. Without them the app builds in DEMO posture, whose every screen carries a 'Demo data' banner and whose board is twelve third-party trademarks. This is a failed run, not a skipped one."
            exit 1
          fi
          echo "All four secrets present — the build will be LIVE."

      - uses: ./.github/actions/setup-node

      - uses: ./.github/actions/setup-flutter

      - name: Set up ChromeDriver
        uses: nanasess/setup-chromedriver@e913548694400f275b4070efcd90f47dbbc8914c # v3.0.0

      - name: flutter pub get
        working-directory: apps/subscriptiontracker
        run: flutter pub get --enforce-lockfile

      - name: Provision throwaway confirmed user
        id: user
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node tooling/e2e/provision_user.mjs

      - name: Capture the set
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          E2E_EMAIL: ${{ steps.user.outputs.email }}
          E2E_PASSWORD: ${{ steps.user.outputs.password }}
        run: |
          set -euo pipefail
          export CHROME_EXECUTABLE="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser)"
          echo "Chrome: $CHROME_EXECUTABLE"
          node tooling/store/capture-play-screenshots.mjs --app subscriptiontracker

      # 🔴 --single-threaded, like the other six steps that start a relaunching
      # guard (#648: ci.yml ×3, build-platforms.yml, submit-play.yml ×2). The
      # guard relaunches ITSELF with the flag, and the relaunching PARENT is not
      # immune to the exit hang (nodejs/node#54918): measured under
      # --stress-concurrent-allocation it hung 4 of 12 elf runs and 4 of 12 stamp
      # runs AFTER the child had printed its whole verdict. With the flag on the
      # command line there is no parent to hang. This step was the last one left,
      # carried as the one declared gap in test/single-threaded-relaunch.test.mjs
      # because the file belonged to another wave on 2026-09-11; that entry goes
      # in the same commit, because a ratchet that outlives its gap is a lie.
      - name: The captured set satisfies the listing-asset guard
        run: node --single-threaded tooling/ci/assert-listing-assets.mjs

      - name: Upload the screenshot set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: play-screenshots-subscriptiontracker
          path: |
            apps/subscriptiontracker/store/android-play/screenshots/
            apps/subscriptiontracker/store/android-play/screenshots-tablet/
          if-no-files-found: error

      # why: PROPOSED, never pushed. Screenshots are a sworn store filing; a machine may
      # capture them and must not commit them to a protected branch unreviewed. If
      # gh pr create is refused the branch is still pushed and the pixels are still
      # uploaded as an artifact -- docs/ci/store-screenshots.md carries that path.
      - name: Propose the set for human review (pull request)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Both sets, for the same reason as the upload above: the capture
          # produces two device types and a PR proposing one is a PR that leaves
          # the listing one type short — which is exactly the state
          # assert-play-device-coverage.mjs fails the submission lane for.
          SHOTS="apps/subscriptiontracker/store/android-play/screenshots apps/subscriptiontracker/store/android-play/screenshots-tablet"
          BRANCH="chore/play-screenshots-${{ github.run_id }}"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # -f: the listing directory is not gitignored, but being explicit means
          # a future ignore rule cannot silently drop the payload of this PR.
          git add -f $SHOTS
          if git diff --cached --quiet; then
            echo "::notice title=Nothing to propose::The captured set is byte-identical to what is already committed. The listing already carries this exact capture; no pull request is needed."
            exit 0
          fi

          git checkout -b "$BRANCH"
          git commit -F - <<'MSG'
          chore(play): the captured screenshot set, for review

          Captured live by .github/workflows/store-screenshots.yml against a
          build with the real backend defines, so no "Demo data" banner and none
          of the twelve third-party trademarks the demo seed carries.

          CAPTURE.json records the posture; tooling/ci/assert-listing-assets.mjs
          proves size, count, aspect, format and the ABSENCE OF THE DEMO BANNER
          in pixels, and refuses a set whose provenance nobody wrote down.

          What it cannot prove is whether these are the screens worth showing.
          That is the reason this arrives as a pull request: look at the images
          in the diff before merging.
          MSG

          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"

          # ── 🔴 `gh pr create` CAN BE REFUSED, AND A REFUSAL IS NOT A LISTING ─
          # "Allow GitHub Actions to create and approve pull requests"
          # (repository Settings → Actions → General) gates every `gh pr create`
          # run by GITHUB_TOKEN. Measured OFF on 2026-08-26
          # (`can_approve_pull_request_reviews: false`), and this call site had
          # never executed: the one green run (30922349590, 2026-08-04) predates
          # this step, and the two runs since both failed in `Capture the set`
          # and skipped it. This job is the ONLY producer of the Play tablet
          # set, so a silent refusal here is a submission that stays blocked
          # with a green tick over it.
          set +e
          gh pr create \
            --base "${GITHUB_REF_NAME}" \
            --head "$BRANCH" \
            --title "chore(play): the captured screenshot set, for review" \
            --body "Captured by run \`${{ github.run_id }}\`. **Look at the images in the Files changed tab** — the guard proves size, count, format, aspect and that no demo banner is present in the pixels; it cannot judge whether these are the screens worth showing, and Google requires screenshots to demonstrate the actual in-app experience. Merging is the human decision this PR exists to ask for." > "${RUNNER_TEMP}/gh-pr-create.log" 2>&1
          PR_RC=$?
          set -e
          cat "${RUNNER_TEMP}/gh-pr-create.log"

          if [ "$PR_RC" -ne 0 ]; then
            if grep -qiF 'not permitted to create or approve pull requests' "${RUNNER_TEMP}/gh-pr-create.log"; then
              CAUSE='the repository setting "Allow GitHub Actions to create and approve pull requests" is OFF.'
              REMEDY='REMEDY (owner work — no workflow can set this for itself): Settings → Actions → General → Workflow permissions → tick "Allow GitHub Actions to create and approve pull requests". API equivalent: gh api -X PUT "repos/'"${GITHUB_REPOSITORY}"'/actions/permissions/workflow" -F can_approve_pull_request_reviews=true'
            else
              CAUSE="gh pr create exited ${PR_RC} for a reason this step does not recognise."
              REMEDY='REMEDY: read the gh output above.'
            fi

            echo "::error title=The screenshot set was captured but the pull request could not be opened::${CAUSE} THE CAPTURE IS NOT LOST — branch ${BRANCH} is pushed and the same pixels are already uploaded as this run's play-screenshots-subscriptiontracker artifact; open the pull request by hand from ${BRANCH} into ${GITHUB_REF_NAME}. ${REMEDY}"
            exit 1
          fi

      # why: always(), because this lane provisions a real confirmed user in PRODUCTION
      # Supabase. A failed run that skipped its own cleanup leaves that account behind.
      - name: Purge the throwaway user
        if: always()
        env:
          E2E_USER_ID: ${{ steps.user.outputs.user_id }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUBSCRIPTIONTRACKER_D1_DATABASE_ID: 0a36d6a0-c909-40aa-853e-970de3482321
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node tooling/e2e/purge.mjs
