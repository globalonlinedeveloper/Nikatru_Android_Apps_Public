name: "✨ Feature request"
description: A capability you want in something this repository already ships
title: "[feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Requests are read and most are declined — an extension that does one thing
        well is the product, and every feature is permanent maintenance plus, often,
        a new permission users have to accept. The ones that get built are usually
        the ones that make the hand-off to an AI assistant better, so the third
        field below carries a lot of weight.

  - type: input
    id: tool
    attributes:
      label: Which extension, app or site is this for?
      description: Name it. If it does not exist yet and it is an extension, use the "Propose a new extension" form instead.
      placeholder: FullShot
    validations: { required: true }

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do, and what stops you today?
      description: The problem, not the solution. What you did instead is useful too.
    validations: { required: true }

  - type: textarea
    id: handoff
    attributes:
      label: The AI hand-off — what does this let an assistant do that it can't now?
      description: >-
        The extensions exist to get context out of the browser and into an assistant
        in a form it can actually use, so for an extension request this field carries
        a lot of weight. For an app or a site it often will not apply — say so
        plainly. It's not disqualifying; it just needs to earn its place another way.

  - type: textarea
    id: proposal
    attributes:
      label: What would it look like?
      description: Where it lives in the UI, what the default is, what happens when it's off.

  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints this has to live inside
      description: >-
        These bind every EXTENSION in this repository and are not negotiable there. An
        app or a site request is judged on its own terms — tick what applies and say
        which of these your idea cannot meet, and why.
      options:
        - label: It works with no account, no server and no network call.
        - label: It needs no new permission — or if it does, I've said which and why below.
        - label: It does not need a build step or a third-party runtime dependency.

  - type: textarea
    id: permission
    attributes:
      label: If it needs a new permission, which one and why?
      description: >-
        Every permission is shown to every user at install and has to be justified
        to store reviewers — three of them for an extension, and the app stores for
        an app. A feature that needs a broad host or device permission is much
        harder to land than the same feature behind an optional one.
