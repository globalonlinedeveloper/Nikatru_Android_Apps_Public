# ─────────────────────────────────────────────────────────────────────────────
# Subly — the app declaration. [ADR 067] decision 2: an app is app.yaml + its
# own screens.
#
# THIS FILE IS THE SOURCE. Do not edit anything it renders — change a value
# here and run:
#
#     node tooling/app-yaml/render.mjs
#
# It renders catalog/apps.json (the published catalogue, from which the live
# site's feed is generated in turn) and, in every store channel directory this
# app carries, title.txt · short-description.txt · category.txt ·
# privacy-policy-url.txt · support-url.txt.
#
# It does NOT render, and must never render:
#   · the four SWORN declarations — android-play/data-safety.json,
#     content-rating.json, ads-declaration.json and ios-appstore/
#     privacy-manifest.json. They are statements about Subly's real code with
#     their own citations; [ADR 037]: "a sworn declaration regenerated by a
#     template is a statement nobody made."
#   · the EDITORIAL copy — long-description.txt, keywords.txt, subtitle.txt,
#     promotional-text.txt, search-terms.txt, snap-name.txt, license.txt.
#     Reviewed prose about what Subly actually does. Yours to sharpen.
# ─────────────────────────────────────────────────────────────────────────────

# 🔴 THE STORE IDENTIFIERS HAVE MOVED; `id` HAS NOT — AND THE TWO ARE DIFFERENT
# KINDS OF NAME. This paragraph replaces one that said the identifiers were
# "deliberately not renamed"; that was true until the OWNER RULED OTHERWISE on
# 2026-09-09 ("we need to remove old name completely"), and a stale paragraph is
# how a settled decision gets re-derived by the next reader.
#
# WHAT MOVED, and why it had to move NOW rather than later: every one of these
# is bound PERMANENTLY and unreclaimably at the FIRST upload on its channel, and
# on 2026-09-09 not one of them was claimed (Play 404, iTunes lookup
# resultCount 0 against a green Gmail control, snap 404 against a green firefox
# control). That window is the whole reason for the sequencing.
#
#   com.nikatru.subscriptiontracker   Android applicationId + namespace,
#                                     iOS + macOS bundle id, Linux APPLICATION_ID
#   subscription-tracker              Linux BINARY_NAME
#   nikatru-subscription-tracker      the snap name
#
# ⚠️ WHAT `id` STILL IS, and why renaming it is a SEPARATE, SEQUENCED change
# rather than a slower version of this one. `id` is not only a repo directory:
# it is the Cloudflare Pages PROJECT NAME (`deploy-web.yml` passes
# `--project-name=${{ matrix.app }}`), the Worker name `subscriptiontracker-api`, the D1
# database `subly_db`, the DNS label in subly.nikatru.com, and the analytics
# `app_id` value that keys every historical row. Those are LIVE RESOURCES, not
# declarations — renaming them in this file does not rename them in the account,
# it PROVISIONS NEW ONES beside the old, and the replacement `*.pages.dev`
# subdomain is not knowable in advance (see `hosts.pagesOrigin` below: Cloudflare
# appended `-9cp` precisely because `subscriptiontracker` was already taken). pre_gen.dart's
# rule still holds for exactly this half — "a rename is not a rename; it is an
# orphaning" — which is why the `id` rename is owner-gated on a live migration
# and not folded in here. NOTHING A USER SEES READS `id` today.
id: subscriptiontracker
name: Nikatru Subscription Tracker
# The ICON label. Shares the token `Subscription(s)` with `name` per Apple
# QA1892, and is what a home screen has room for — see the schema.
shortName: Subscriptions
tagline: Track every subscription in one place
category: Productivity
status: live

# No DNS record is needed for either host: [ADR 006] locked a proxied wildcard
# *.nikatru.com. What a new host needs is ATTACHMENT, not a record.
hosts:
  web: subly.nikatru.com
  # WHERE THE APEX ROUTER FETCHES THE BYTES. Not derivable and deliberately
  # declared: Cloudflare appended `-9cp` when the project name `subscriptiontracker` was
  # already taken, so `<id>.pages.dev` is wrong for exactly this app. Measured
  # 2026-09-09 from the Pages API -- project `subscriptiontracker`, subdomain
  # `subly-9cp.pages.dev`. It is preferred over `web` because *.pages.dev sits
  # OUTSIDE the nikatru.com zone, so the Redirect Rule that 301s the retired
  # subdomain cannot match the router's own proxy subrequest.
  pagesOrigin: subly-9cp.pages.dev
  api: api.nikatru.com

platforms:
  - web

# Keyed by tooling/channel-register.json's `storefrontKey`. `web` is derived
# from hosts.web and is refused here. Every other key is absent until a store
# issues a real listing URL — the renderer writes null, because a plausible
# invented URL is a link a stranger follows into a 404.
listings:

legal:
  privacyPolicyUrl: https://nikatru.com/privacy
  supportUrl: https://nikatru.com/contact
